name: Build historical React DevTools
on:
  workflow_dispatch:
    inputs:
      major:
        type: choice
        default: all
        options: [all, "2", "4", "5", "6", "7"]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: versions
        env:
          ARCHIVE_MAJOR: ${{ inputs.major }}
        run: |
          python3 -c 'import os,json; entries=json.load(open("scripts/build-versions.json")); major=os.environ["ARCHIVE_MAJOR"]; selected=[v for v in entries if major=="all" or v["major"]==major]; assert selected; print("versions="+json.dumps(selected))' >> "$GITHUB_OUTPUT"
  build:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: archive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force
      - name: Install upstream dependencies
        working-directory: upstream
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --ignore-engines --network-timeout 180000
      - name: Use compatible ZIP packer for v2
        if: matrix.major == '2'
        working-directory: upstream
        run: yarn add adm-zip@0.5.16 --ignore-scripts --ignore-engines
      - name: Build React dependencies
        if: matrix.major != '2'
        working-directory: upstream
        env:
          NODE_OPTIONS: ${{ matrix.node_options }}
        run: |
          if [ '${{ matrix.major }}' = '4' ]; then
            python3 -c 'from pathlib import Path; import json; p=Path("package.json"); d=json.loads(p.read_text()); old=d["scripts"]["build-for-devtools"]; suffix=" && cp -r ./build/node_modules build/oss-experimental/"; assert old.endswith(suffix); d["scripts"]["build-for-devtools"]=old[:-len(suffix)]; p.write_text(json.dumps(d,indent=2)+"\n")'
          fi
          yarn build-for-devtools
      - name: Build Chrome extension
        working-directory: upstream
        env:
          NODE_OPTIONS: ${{ matrix.node_options }}
        run: |
          if [ '${{ matrix.major }}' = '2' ]; then
            yarn build:extension:chrome
          else
            cd packages/react-devtools-extensions
            yarn build:chrome
          fi
      - name: Package and validate
        run: |
          if [ '${{ matrix.major }}' = '2' ]; then
            src=upstream/shells/chrome/build/unpacked
          else
            src=upstream/packages/react-devtools-extensions/chrome/build/unpacked
          fi
          python3 archive/scripts/package-archive.py "$src" distribution '${{ matrix.version }}' '${{ matrix.repository }}' '${{ matrix.revision }}'
      - uses: actions/upload-artifact@v4
        with:
          name: react-devtools-v${{ matrix.major }}
          path: distribution/
          if-no-files-found: error
          retention-days: 30
